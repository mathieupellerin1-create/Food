<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Londres 🇬🇧">
<style>html,body{margin:0}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}</style>
<title>Londres 6–8 novembre</title>
<style>
/* Layout: colonne mobile façon app iOS — en-tête coloré par jour (couleur d'une ligne du métro), cartes d'activités, barre d'onglets en bas */
:root {
  --bg: #F2F2F7;
  --card: #FFFFFF;
  --fg: #1C1C1E;
  --muted: #6C6C72;
  --hair: #E3E3E8;
  --soft: #F2F2F7;
  --ok: #1E8E3E;
  --warn-bg: #FFF7DB;
  --warn-fg: #6E5300;
  --link-bg: #E6F0FD;
  --link-fg: #1662C4;
  --danger: #D92D20;
  --danger-bg: #FDEEEE;
  --nav-bg: rgba(242,242,247,0.92);
  --shadow: 0 2px 8px rgba(0,0,0,0.07);
  --ui: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #000000; --card: #1C1C1E; --fg: #F2F2F7; --muted: #A1A1A8; --hair: #2C2C2E; --soft: #2C2C2E;
  --ok: #4CD964; --warn-bg: #2B2510; --warn-fg: #F2D27A; --link-bg: #13283F; --link-fg: #7DB4FF;
  --danger: #FF6B5E; --danger-bg: #3A1715; --nav-bg: rgba(18,18,20,0.92); --shadow: none; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #000000; --card: #1C1C1E; --fg: #F2F2F7; --muted: #A1A1A8; --hair: #2C2C2E; --soft: #2C2C2E;
  --ok: #4CD964; --warn-bg: #2B2510; --warn-fg: #F2D27A; --link-bg: #13283F; --link-fg: #7DB4FF;
  --danger: #FF6B5E; --danger-bg: #3A1715; --nav-bg: rgba(18,18,20,0.92); --shadow: none; color-scheme: dark; }

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body { font-family: var(--ui); background: var(--bg); color: var(--fg); max-width: 480px; margin: 0 auto; overflow-x: hidden; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--day); }
button { font-family: inherit; }
:focus-visible { outline: 3px solid var(--day); outline-offset: 2px; }

#header { background: var(--day); padding-top: 14px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); transition: background .35s ease; }
.head-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 10px; }
.eyebrow { color: rgba(255,255,255,.78); font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
#day-title { color: #fff; font-size: 22px; font-weight: 800; line-height: 1.2; margin: 2px 0 0; text-wrap: balance; }
#day-line { display: inline-flex; align-items: center; gap: 6px; margin-top: 6px; font-size: 11px; font-weight: 700; color: #fff; background: rgba(0,0,0,.18); border-radius: 20px; padding: 3px 9px 3px 4px; }
.roundel { width: 16px; height: 16px; border-radius: 50%; border: 3px solid #fff; position: relative; }
.roundel::after { content: ""; position: absolute; left: -6px; right: -6px; top: 50%; height: 4px; margin-top: -2px; background: #fff; }
.counter { text-align: right; flex-shrink: 0; }
.counter .lbl { color: rgba(255,255,255,.8); font-size: 11px; }
.counter .num { color: #fff; font-size: 26px; font-weight: 800; font-variant-numeric: tabular-nums; }
.counter .tot { font-size: 13px; opacity: .7; font-weight: 500; }
.edit-btn { background: rgba(255,255,255,.2); border: none; border-radius: 10px; padding: 6px 10px; font-size: 12px; font-weight: 700; color: #fff; cursor: pointer; margin-left: 6px; }
.edit-btn[aria-pressed="true"] { background: #fff; color: var(--day); }
.bar { background: rgba(255,255,255,.25); border-radius: 4px; height: 4px; margin-bottom: 14px; overflow: hidden; }
.bar > div { background: #fff; height: 100%; border-radius: 4px; transition: width .5s ease; }
#tabs { display: flex; gap: 5px; overflow-x: auto; scrollbar-width: none; }
#tabs::-webkit-scrollbar { display: none; }
.tab { flex-shrink: 0; border: none; border-radius: 10px 10px 0 0; padding: 8px 13px; font-size: 11px; font-weight: 800; letter-spacing: .04em; color: #fff; background: rgba(255,255,255,.18); cursor: pointer; }
.tab[aria-selected="true"] { background: var(--bg); color: var(--fg); }

#tip { background: var(--warn-bg); color: var(--warn-fg); font-size: 12.5px; line-height: 1.4; min-height: 40px; display: flex; align-items: center; padding-block: 9px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
main { padding-block: 14px 130px; padding-left: max(14px, env(safe-area-inset-left, 0px)); padding-right: max(14px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 10px; }

.slot { font-size: 11px; font-weight: 700; color: var(--muted); letter-spacing: .07em; text-transform: uppercase; margin: 6px 4px 0; }
.item { background: var(--card); border-radius: 16px; border: 2px solid transparent; box-shadow: var(--shadow); transition: border-color .2s, opacity .2s; }
.item.done { border-color: var(--day); opacity: .78; }
.item.custom { border-color: #E3B505; }
.item-row { display: flex; align-items: center; padding: 12px; gap: 11px; cursor: pointer; }
.check { flex-shrink: 0; width: 28px; height: 28px; border-radius: 50%; border: 2px solid #C7C7CC; background: transparent; display: grid; place-items: center; cursor: pointer; color: #fff; font-size: 14px; font-weight: 800; }
.check[aria-checked="true"] { background: var(--day); border-color: var(--day); }
.icon { width: 40px; height: 40px; border-radius: 12px; flex-shrink: 0; background: color-mix(in srgb, var(--day) 14%, transparent); display: grid; place-items: center; font-size: 20px; }
.txt { flex: 1; min-width: 0; }
.title { font-size: 15px; font-weight: 650; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.done .title { text-decoration: line-through; }
.meta { display: flex; flex-wrap: wrap; gap: 4px 8px; margin-top: 2px; font-size: 11px; font-weight: 600; }
.meta .when { color: var(--muted); font-variant-numeric: tabular-nums; }
.meta .price { color: var(--ok); }
.meta .flag { color: var(--danger); }
.meta .mine { color: #B48A00; }
.chev { color: #B0B0B6; font-size: 18px; transition: transform .2s; flex-shrink: 0; }
.chev.open { transform: rotate(90deg); }
.edit-tools { display: flex; gap: 4px; flex-shrink: 0; }
.mini { border: none; border-radius: 9px; padding: 6px 9px; font-size: 13px; cursor: pointer; background: var(--soft); color: var(--fg); }
.mini.del { background: var(--danger-bg); color: var(--danger); }
.mini:disabled { opacity: .35; }

.more { padding: 0 14px 14px; border-top: 1px solid var(--hair); }
.desc { padding-top: 10px; font-size: 13.5px; line-height: 1.55; }
.friend { margin-top: 10px; font-size: 12.5px; line-height: 1.5; background: color-mix(in srgb, var(--day) 8%, var(--card)); border-left: 3px solid var(--day); border-radius: 4px 10px 10px 4px; padding: 8px 10px; }
.friend b { display: block; font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-bottom: 2px; }
.sub { font-size: 11px; font-weight: 700; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; margin: 12px 0 6px; }
.route { display: flex; align-items: flex-start; gap: 10px; background: var(--soft); border-radius: 10px; padding: 9px 11px; margin-bottom: 6px; }
.line-pill { flex-shrink: 0; min-width: 74px; text-align: center; border-radius: 6px; padding: 3px 6px; font-size: 10.5px; font-weight: 800; letter-spacing: .02em; color: #fff; }
.route-info { flex: 1; min-width: 0; }
.route-detail { font-size: 12.5px; line-height: 1.4; }
.route-foot { font-size: 11px; color: var(--muted); margin-top: 2px; font-variant-numeric: tabular-nums; }
.links { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.link-btn { display: inline-flex; align-items: center; gap: 5px; background: var(--link-bg); color: var(--link-fg); border-radius: 8px; padding: 7px 12px; font-size: 12px; font-weight: 650; text-decoration: none; }

.add-btn { width: 100%; padding: 14px; border-radius: 16px; background: transparent; border: 2px dashed #C2C2C8; font-size: 14px; font-weight: 650; color: var(--muted); cursor: pointer; }
.restore { background: none; border: none; color: var(--link-fg); font-size: 13px; font-weight: 600; cursor: pointer; padding: 6px; }
.done-banner { text-align: center; padding: 14px 0 4px; }
.done-banner .big { font-size: 34px; }
.done-banner .t { font-weight: 800; margin-top: 6px; }
.done-banner .s { font-size: 13px; color: var(--muted); margin-top: 3px; }

/* Bonnes adresses */
.spot-head { background: var(--day); color: #fff; border-radius: 18px; padding: 16px 18px; }
.spot-head h2 { margin: 0; font-size: 20px; }
.spot-head p { margin: 4px 0 0; font-size: 12.5px; opacity: .85; }
.spot { background: var(--card); border-radius: 16px; padding: 14px; box-shadow: var(--shadow); }
.spot-top { display: flex; gap: 12px; align-items: flex-start; }
.spot-name { font-size: 15px; font-weight: 700; }
.spot-zone { font-size: 11.5px; color: var(--muted); margin-top: 2px; }
.spot-desc { font-size: 12.5px; line-height: 1.5; margin: 8px 0; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.tag { font-size: 11px; font-weight: 600; background: var(--soft); color: var(--muted); border-radius: 6px; padding: 3px 8px; }
.ask { background: var(--card); border-radius: 16px; padding: 16px; box-shadow: var(--shadow); }
.ask h3 { margin: 0 0 4px; font-size: 15px; }
.ask p { margin: 0 0 12px; font-size: 12.5px; color: var(--muted); }

/* Sheets */
.overlay { position: fixed; inset: 0; background: rgba(0,0,0,.5); display: flex; align-items: flex-end; justify-content: center; z-index: 50; }
.sheet { background: var(--card); border-radius: 22px 22px 0 0; width: 100%; max-width: 480px; max-height: 84vh; overflow-y: auto; padding-top: 18px; padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 22px); padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); }
.handle { width: 36px; height: 4px; background: var(--hair); border-radius: 2px; margin: 0 auto 16px; }
.sheet h3 { margin: 0 0 4px; font-size: 17px; }
.sheet .hint { font-size: 13px; color: var(--muted); margin: 0 0 14px; }
.seg { display: flex; background: var(--soft); border-radius: 10px; padding: 3px; margin-bottom: 14px; }
.seg button { flex: 1; border: none; background: transparent; padding: 8px; border-radius: 8px; font-size: 13px; font-weight: 650; color: var(--muted); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--card); color: var(--fg); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
.field { width: 100%; padding: 13px 14px; border-radius: 12px; border: 2px solid var(--hair); font-size: 15px; font-family: inherit; background: var(--card); color: var(--fg); margin-bottom: 10px; }
.field:focus { border-color: var(--day); outline: none; }
textarea.field { resize: vertical; min-height: 72px; }
.primary { width: 100%; padding: 14px; border-radius: 14px; background: var(--day); color: #fff; border: none; font-size: 16px; font-weight: 700; cursor: pointer; }
.primary:disabled { opacity: .5; }
.secondary { width: 100%; padding: 12px; border-radius: 14px; background: transparent; border: 2px solid var(--hair); font-size: 14px; font-weight: 600; color: var(--muted); cursor: pointer; margin-top: 8px; }
.loading { text-align: center; padding: 24px 0; color: var(--muted); font-size: 14px; }
.spin { display: inline-block; font-size: 30px; animation: spin 1.2s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.preview { background: var(--soft); border-radius: 14px; padding: 14px; margin-bottom: 12px; }
.err { background: var(--danger-bg); color: var(--danger); border-radius: 12px; padding: 12px; font-size: 13px; line-height: 1.5; margin-bottom: 10px; }

#nav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 480px; background: var(--nav-bg); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-top: 1px solid var(--hair); display: flex; justify-content: space-around; padding-top: 8px; padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 8px); padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px)); z-index: 40; }
.nav-btn { display: flex; flex-direction: column; align-items: center; gap: 2px; background: none; border: none; cursor: pointer; padding: 3px 8px; color: var(--muted); font-size: 10px; font-weight: 600; }
.nav-btn .ni { font-size: 21px; }
.nav-btn[aria-current="true"] { color: var(--navc); }
/* Dépenses */
.sync { display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 650; color: var(--muted); }
.sync i { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.sync.on i { background: var(--ok); }
.panel { background: var(--card); border-radius: 16px; padding: 14px; box-shadow: var(--shadow); }
.panel h3 { margin: 0 0 10px; font-size: 15px; }
.total { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.total .big { font-size: 28px; font-weight: 800; font-variant-numeric: tabular-nums; }
.total .small { font-size: 12px; color: var(--muted); text-align: right; }
.people { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 12px; }
.person { background: var(--soft); border-radius: 12px; padding: 10px 8px; text-align: center; min-width: 0; }
.avatar { width: 34px; height: 34px; border-radius: 50%; margin: 0 auto 4px; display: grid; place-items: center; color: #fff; font-weight: 800; font-size: 14px; }
.person .nm { font-size: 13px; font-weight: 700; }
.person .pd { font-size: 11px; color: var(--muted); margin-top: 2px; font-variant-numeric: tabular-nums; }
.person .net { font-size: 13px; font-weight: 800; margin-top: 4px; font-variant-numeric: tabular-nums; }
.pos { color: var(--ok); } .neg { color: var(--danger); }
.transfer { display: flex; align-items: center; gap: 8px; padding: 9px 0; border-top: 1px solid var(--hair); font-size: 14px; }
.transfer:first-of-type { border-top: none; }
.transfer .amt { margin-left: auto; font-weight: 800; font-variant-numeric: tabular-nums; }
.exp { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid var(--hair); }
.exp:first-of-type { border-top: none; }
.exp .txt .title { font-size: 14px; }
.exp .sum { text-align: right; font-variant-numeric: tabular-nums; flex-shrink: 0; }
.exp .sum b { display: block; font-size: 14px; }
.exp .sum span { font-size: 11px; color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
.chip { border: 2px solid var(--hair); background: var(--card); color: var(--fg); border-radius: 20px; padding: 6px 12px; font-size: 13px; font-weight: 650; cursor: pointer; }
.chip[aria-pressed="true"] { border-color: var(--day); background: color-mix(in srgb, var(--day) 14%, var(--card)); }
.row2 { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; }
.row2 .field { margin-bottom: 10px; }
.rate { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--muted); margin-top: 10px; flex-wrap: wrap; }
.rate input { width: 76px; padding: 6px 8px; border-radius: 8px; border: 2px solid var(--hair); background: var(--card); color: var(--fg); font-size: 13px; font-family: inherit; }
.empty { text-align: center; color: var(--muted); font-size: 13px; padding: 12px 0 4px; line-height: 1.5; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>


<div id="header">
  <div class="head-top">
    <div>
      <div class="eyebrow">🇬🇧 Londres · 6–8 novembre 2026</div>
      <h1 id="day-title"></h1>
      <div id="day-line"><span class="roundel"></span><span id="day-line-name"></span></div>
    </div>
    <div class="counter">
      <div class="lbl">activités</div>
      <div style="display:flex;align-items:center;justify-content:flex-end">
        <span><span class="num" id="n-done">0</span><span class="tot" id="n-total">/0</span></span>
        <button class="edit-btn" id="edit-btn" aria-pressed="false" aria-label="Modifier l'ordre">✏️</button>
      </div>

  <div class="bar"><div id="bar" style="width:0%"></div></div>
  <div id="tabs" role="tablist"></div>
</div>
<div id="tip" aria-live="polite"></div>
<main id="main"></main>
<nav id="nav"></nav>
<div id="sheet-root"></div>

function items(dayId) {
  const d = dayOf(dayId);
  const del = deleted[dayId] || [];
  const all = [...d.items.filter(i => !del.includes(i.id)), ...(custom[dayId] || [])];
  const ord = orders[dayId];
  if (!ord) return all;
  const sorted = ord.map(id => all.find(i => i.id === id)).filter(Boolean);
  all.forEach(i => { if (!sorted.includes(i)) sorted.push(i); });
  return sorted;
}

// Partagé entre les viewers connectés (db) quand c'est possible, sinon gardé sur l'appareil.
let db = null;
let expenses = store.get("expenses", []);
let rate = store.get("rate", 1.15); // € pour 1 £, modifiable
let expForm = store.get("expform", { label: "", amount: "", cur: "GBP", payer: "Mathieu", among: PEOPLE.map(p => p.name) });
let pendingDel = null;
let expStatus = "local";

function saveForm() { store.set("expform", expForm); }
const fmt = (n) => ((Math.round(n * 100) / 100) || 0).toLocaleString("fr-FR", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const toEur = (x) => x.cur === "EUR" ? x.amount : x.amount * rate;
const pColor = (n) => (PEOPLE.find(p => p.name === n) || {}).color || "#666";

function balances() {
  const b = Object.fromEntries(PEOPLE.map(p => [p.name, { paid: 0, share: 0 }]));
  for (const x of expenses) {
    const eur = toEur(x), who = (x.among || []).filter(n => b[n]);
    if (!b[x.payer] || !who.length) continue;
    b[x.payer].paid += eur;
    who.forEach(n => b[n].share += eur / who.length);
  }
  return b;
}
function settle(b) {
  const deb = [], cred = [];
  for (const [n, v] of Object.entries(b)) { const net = v.paid - v.share; if (net < -0.005) deb.push([n, -net]); else if (net > 0.005) cred.push([n, net]); }
  deb.sort((a, c) => c[1] - a[1]); cred.sort((a, c) => c[1] - a[1]);
  const out = []; let i = 0, j = 0;
  while (i < deb.length && j < cred.length) {
    const m = Math.min(deb[i][1], cred[j][1]);
    out.push({ from: deb[i][0], to: cred[j][0], amt: m });
    deb[i][1] -= m; cred[j][1] -= m;
    if (deb[i][1] < 0.005) i++; if (cred[j][1] < 0.005) j++;
  }
  return out;
}

function renderExpenses() {
  $("#day-title").textContent = "Split de dépenses";
  $("#day-line").hidden = true;
  const b = balances();
  const total = expenses.reduce((s, x) => s + toEur(x), 0);
  const tr = settle(b);
  const list = [...expenses].sort((a, c) => (c.ts || 0) - (a.ts || 0));
  const syncLbl = expStatus === "shared" ? "Partagé entre vous, en direct" : expStatus === "loading" ? "Connexion…" : "Enregistré sur ce téléphone seulement";
  $("#main").innerHTML = `
    <div class="panel">
      <div class="total"><div><div class="sub" style="margin:0 0 2px">Total du séjour</div><div class="big">${fmt(total)} €</div></div>
      <div class="small">${expenses.length} dépense${expenses.length > 1 ? "s" : ""}<br>soit ${fmt(total / PEOPLE.length)} € / personne</div></div>
      <div class="people">${PEOPLE.map(p => { const v = b[p.name], net = v.paid - v.share; return `
        <div class="person"><div class="avatar" style="background:${p.color}">${p.name[0]}</div><div class="nm">${p.name}</div>
        <div class="pd">a payé ${fmt(v.paid)} €</div>
        <div class="net ${net > 0.005 ? "pos" : net < -0.005 ? "neg" : ""}">${net > 0.005 ? "+" : ""}${fmt(net)} €</div></div>`; }).join("")}</div>
      <div style="margin-top:10px"><span class="sync${expStatus === "shared" ? " on" : ""}"><i></i>${syncLbl}</span></div>
    </div>

    <div class="panel">
      <h3>Qui rembourse qui</h3>
      ${tr.length ? tr.map(t => `<div class="transfer"><span class="avatar" style="width:26px;height:26px;font-size:12px;margin:0;background:${pColor(t.from)}">${t.from[0]}</span>${t.from}
        <span style="color:var(--muted)">→</span><span class="avatar" style="width:26px;height:26px;font-size:12px;margin:0;background:${pColor(t.to)}">${t.to[0]}</span>${t.to}
        <span class="amt">${fmt(t.amt)} €</span></div>`).join("")
        : `<div class="empty">${expenses.length ? "Tout le monde est à l'équilibre 👌" : "Les remboursements s'afficheront ici dès la première dépense."}</div>`}
    </div>

    <div class="panel">
      <h3>Ajouter une dépense</h3>
      ${expMsg ? `<div class="err">${esc(expMsg)}</div>` : ""}
      <label class="sub" for="exp-label" style="display:block;margin-top:0">Quoi</label>
      <input id="exp-label" class="field" placeholder="Ex. Dîner Chinatown, Uber, London Eye…" value="${esc(expForm.label)}">
      <label class="sub" for="exp-amount" style="display:block">Montant</label>
      <div class="row2"><input id="exp-amount" class="field" inputmode="decimal" placeholder="0,00" value="${esc(expForm.amount)}">
        <div class="chips" style="margin:0"><button class="chip" data-cur="GBP" aria-pressed="${expForm.cur === "GBP"}">£</button><button class="chip" data-cur="EUR" aria-pressed="${expForm.cur === "EUR"}">€</button></div></div>
      <div class="sub">Payé par</div>
      <div class="chips">${PEOPLE.map(p => `<button class="chip" data-payer="${p.name}" aria-pressed="${expForm.payer === p.name}">${p.name}</button>`).join("")}</div>
      <div class="sub">Partagé entre</div>
      <div class="chips">${PEOPLE.map(p => `<button class="chip" data-among="${p.name}" aria-pressed="${expForm.among.includes(p.name)}">${expForm.among.includes(p.name) ? "✓ " : ""}${p.name}</button>`).join("")}</div>
      <button class="primary" id="exp-add">Ajouter la dépense</button>
      <div class="rate"><label for="exp-rate">Taux : 1 £ =</label><input id="exp-rate" inputmode="decimal" value="${String(rate).replace(".", ",")}"> € <span>(à ajuster au taux de votre banque)</span></div>
    </div>

    <div class="panel">
      <h3>Historique</h3>
      ${list.length ? list.map(x => `<div class="exp">
        <span class="avatar" style="width:30px;height:30px;font-size:12px;margin:0;flex-shrink:0;background:${pColor(x.payer)}">${esc(x.payer[0])}</span>
        <div class="txt"><div class="title">${esc(x.label)}</div><div class="meta"><span class="when">${esc(x.payer)} · pour ${(x.among || []).length === PEOPLE.length ? "les 3" : esc((x.among || []).join(", "))}</span></div></div>
        <div class="sum"><b>${fmt(x.amount)} ${x.cur === "EUR" ? "€" : "£"}</b>${x.cur === "GBP" ? `<span>${fmt(toEur(x))} €</span>` : ""}</div>
        ${pendingDel === x.id
          ? `<button class="mini del" data-expdel="${x.id}">Supprimer</button><button class="mini" id="exp-cancel-del">Annuler</button>`
          : `<button class="mini del" data-expdel="${x.id}" aria-label="Supprimer ${esc(x.label)}">✕</button>`}
      </div>`).join("") : `<div class="empty">Aucune dépense pour l'instant.<br>Ajoutez la première ci-dessus, par exemple les billets Eurostar.</div>`}
    </div>`;
}

async function addExpense() {
  const amount = parseFloat(String(expForm.amount).replace(/\s/g, "").replace(",", "."));
  if (!expForm.label.trim()) { expMsg = "Indiquez ce qui a été payé."; return render(); }
  if (!(amount > 0)) { expMsg = "Indiquez un montant supérieur à zéro."; return render(); }
  if (!expForm.among.length) { expMsg = "Choisissez au moins une personne pour le partage."; return render(); }
  expMsg = "";
  const x = { id: "e" + Date.now() + Math.random().toString(36).slice(2, 6), label: expForm.label.trim(), amount, cur: expForm.cur, payer: expForm.payer, among: [...expForm.among], ts: Date.now() };
  expForm = { ...expForm, label: "", amount: "" }; saveForm();
  if (db) {
    try { await db.collection("depenses").doc(x.id).set(x); }
    catch (err) { expMsg = "La dépense n'a pas pu être enregistrée en ligne. Vérifiez la connexion et réessayez."; expForm = { ...expForm, label: x.label, amount: String(amount) }; render(); }
  } else { expenses.push(x); store.set("expenses", expenses); render(); }
}
async function delExpense(id) {
  if (pendingDel !== id) { pendingDel = id; return render(); }
  pendingDel = null;
  if (db) { try { await db.collection("depenses").doc(id).delete(); } catch { expMsg = "Suppression impossible pour le moment. Réessayez."; render(); } }
  else { expenses = expenses.filter(x => x.id !== id); store.set("expenses", expenses); render(); }
}
async function setRate(r) {
  rate = r; store.set("rate", r); render();
  if (db) { try { await db.doc("reglages/taux").set({ eurParLivre: r }); } catch {} }
}

(async () => {
  let d = null;
  try { d = window.claude?.use ? await window.claude.use("db") : null; } catch { d = null; }
  if (!d) { expStatus = "local"; if (view === "dep") render(); return; }
  expStatus = "loading"; if (view === "dep") render();
  const timer = setTimeout(() => { if (expStatus === "loading") { expStatus = "local"; if (view === "dep") render(); } }, 10000);
  d.collection("depenses").onSnapshot((snap) => {
    clearTimeout(timer);
    db = d; expStatus = "shared";
    expenses = snap.docs.map(s => ({ ...s.data(), id: s.id }));
    if (view === "dep") render();
  }, () => { clearTimeout(timer); db = null; expStatus = "local"; if (view === "dep") render(); });
  d.doc("reglages/taux").onSnapshot((s) => {
    const r = s.exists ? Number(s.data().eurParLivre) : 0;
    if (r > 0) { rate = r; store.set("rate", r); if (view === "dep") render(); }
  }, () => {});
})();

function move(id, dir) {
  const ids = items(view).map(i => i.id);
  const i = ids.indexOf(id), j = i + dir;
  if (j < 0 || j >= ids.length) return;
  [ids[i], ids[j]] = [ids[j], ids[i]];
  orders[view] = ids; store.set("orders", orders); render();
}
function remove(id) {
  const c = custom[view] || [];
  if (c.some(i => i.id === id)) { custom[view] = c.filter(i => i.id !== id); store.set("custom", custom); }
  else { deleted[view] = [...(deleted[view] || []), id]; store.set("deleted", deleted); }
  delete done[id]; store.set("done", done); render();
}

// ── Ajout d'activité ─────────────────────────────────────────────────
let addMode = "ai", pending = null;
function openAdd() { addMode = sample ? "ai" : "manual"; pending = null; drawAdd(); }
function closeAdd() { $("#sheet-root").innerHTML = ""; }
function drawAdd(state, msg) {
  const d = dayOf(view);
  let body = "";
  if (state === "loading") body = `<div class="loading"><div class="spin">🧭</div><div style="margin-top:10px;font-weight:600;color:var(--fg)">Claude prépare l'activité…</div><div>Trajets depuis le quartier de l'hôtel</div></div>`;
  else if (state === "preview" && pending) body = `<div class="preview"><div style="display:flex;gap:10px;align-items:center"><span style="font-size:28px">${esc(pending.icon)}</span><div><div style="font-weight:800;font-size:16px">${esc(pending.title)}</div><div class="meta"><span class="when">${esc(pending.when || "")}</span><span class="price">${esc(pending.price || "")}</span></div></div></div>
      <div class="desc">${esc(pending.desc)}</div>${(pending.routes || []).map(r => `<div class="route" style="background:var(--card);margin-top:8px"><span class="line-pill" style="background:${lineColor(r.line)};color:${(LINES[r.line] || {}).ink || "#fff"}">${esc((LINES[r.line] || LINES.walk).name)}</span><div class="route-info"><div class="route-detail">${esc(r.detail)}</div><div class="route-foot">${esc([r.time, r.price].filter(Boolean).join(" · "))}</div></div></div>`).join("")}</div>
      <button class="primary" id="add-confirm">Ajouter au ${esc(d.label.toLowerCase())}</button><button class="secondary" id="add-back">Essayer autre chose</button>`;
  else body = `
    ${sample ? `<div class="seg"><button aria-pressed="${addMode === "ai"}" data-mode="ai">✨ Avec Claude</button><button aria-pressed="${addMode === "manual"}" data-mode="manual">✍️ À la main</button></div>` : ""}
    ${msg ? `<div class="err">${esc(msg)}</div>` : ""}
    ${addMode === "ai"
      ? `<label class="sub" for="ai-q" style="display:block;margin-top:0">Lieu ou envie</label><input id="ai-q" class="field" placeholder="Ex. British Museum, Sky Garden, un marché…"><button class="primary" id="ai-go">Générer avec trajets</button>`
      : `<label class="sub" for="m-title" style="display:block;margin-top:0">Titre</label><input id="m-title" class="field" placeholder="Ex. British Museum">
         <label class="sub" for="m-desc" style="display:block">Notes</label><textarea id="m-desc" class="field" placeholder="Horaires, idées, réservation…"></textarea>
         <label class="sub" for="m-dest" style="display:block">Adresse pour Maps (facultatif)</label><input id="m-dest" class="field" placeholder="Ex. British Museum, London">
         <button class="primary" id="m-go">Ajouter</button>`}
    <button class="secondary" id="add-close">Fermer</button>`;
  $("#sheet-root").innerHTML = `<div class="overlay" id="ov"><div class="sheet" role="dialog" aria-label="Ajouter une activité"><div class="handle"></div><h3>Ajouter au ${esc(d.label.toLowerCase())}</h3><p class="hint">${esc(d.title)}</p>${body}</div></div>`;
  $("#ov").addEventListener("click", (e) => {
    if (e.target.id === "ov" || e.target.id === "add-close") return closeAdd();
    const b = e.target.closest("button"); if (!b) return;
    if (b.dataset.mode) { addMode = b.dataset.mode; drawAdd(); }
    if (b.id === "ai-go") generate();
    if (b.id === "m-go") manualAdd();
    if (b.id === "add-confirm") confirmAdd();
    if (b.id === "add-back") { pending = null; drawAdd(); }
  });
  const f = $("#ai-q") || $("#m-title"); if (f) f.focus();
}
function manualAdd() {
  const title = $("#m-title").value.trim();
  if (!title) return drawAdd(null, "Donnez au moins un titre à l'activité.");
  pending = { icon: "📍", title, desc: $("#m-desc").value.trim(), dest: $("#m-dest").value.trim() || null, routes: [] };
  confirmAdd();
}
function confirmAdd() {
  const it = { ...pending, id: "c" + Date.now(), custom: true };
  custom[view] = [...(custom[view] || []), it]; store.set("custom", custom);
  closeAdd(); expanded = it.id; render();
}

const CONTEXT = `Contexte : week-end à Londres du vendredi 6 au dimanche 8 novembre 2026, quatre adultes de la même famille (un père et ses trois enfants adultes), arrivée et départ en Eurostar à St Pancras. Hébergement : Covent & Soho Stays, quartier Covent Garden / Soho (stations proches : Covent Garden, Leicester Square, Tottenham Court Road). Dimanche 8 novembre est le Remembrance Sunday (Whitehall fermé le matin). Paiement du métro en sans contact, plafond 8,90 £/jour en zones 1–2.`;
const LINE_KEYS = Object.keys(LINES).join(", ");

async function generate() {
  const q = $("#ai-q").value.trim();
  if (!q) return drawAdd(null, "Écrivez un lieu ou une envie.");
  const d = dayOf(view);
  drawAdd("loading");
  try {
    const r = await sample.json(`${CONTEXT}
Journée : ${d.label} — ${d.title}. Programme déjà prévu : ${items(view).map(i => i.title).join(" ; ")}.
Demande : « ${q} ».
Crée UNE activité pour ce jour, en français, réaliste et à jour. Réponds uniquement en JSON :
{"icon":"un emoji","title":"court, 40 caractères max","when":"moment conseillé, ex. 15 h ou Fin d'après-midi","price":"prix indicatif ou Gratuit","desc":"2 à 3 phrases utiles (horaires, réservation, à ne pas manquer)","dest":"requête Google Maps précise, ex. British Museum, London","routes":[{"line":"une clé parmi ${LINE_KEYS}","detail":"trajet depuis le quartier de l'hôtel, stations et direction","time":"~15 min","price":"Tarif métro ou Gratuit"}]}
Donne 1 à 2 trajets. Si un prix ou un horaire est incertain, dis-le dans desc.`, { modelTier: "default" });
    if (!r || !r.title) throw new Error("vide");
    pending = r; drawAdd("preview");
  } catch (err) {
    if (err && err.code === "not_granted") { sample = null; addMode = "manual"; return drawAdd(null, "L'accès à Claude n'est pas autorisé sur cette page. Ajoutez l'activité à la main."); }
    if (err && err.code === "rate_limited") return drawAdd(null, "Trop de demandes pour le moment. Réessayez dans une minute, ou ajoutez l'activité à la main.");
    drawAdd(null, "Claude n'a pas pu générer l'activité. Reformulez la demande ou ajoutez-la à la main.");
  }
}

async function askSpot() {
  const q = $("#ask-q").value.trim(); const out = $("#ask-out"); const btn = $("#ask-go");
  if (!q) { out.innerHTML = `<div class="err">Écrivez ce que vous cherchez.</div>`; return; }
  btn.disabled = true; out.innerHTML = `<div class="loading"><div class="spin">🧭</div></div>`;
  try {
    const r = await sample.json(`${CONTEXT}
Demande : « ${q} ». Propose 3 adresses réelles à Londres, si possible proches de l'hôtel ou du parcours. Signale si un lieu risque d'être fermé ou de nécessiter une réservation. Réponds uniquement en JSON : {"results":[{"name":"","zone":"quartier · station","desc":"1 à 2 phrases","maps":"requête Google Maps précise"}]}`, { modelTier: "default" });
    out.innerHTML = (r.results || []).map(s => `<div class="route" style="flex-direction:column;gap:4px"><div style="font-weight:700">${esc(s.name)}</div><div class="route-foot" style="margin:0">${esc(s.zone)}</div><div class="route-detail">${esc(s.desc)}</div><a class="link-btn" style="align-self:flex-start;margin-top:4px" href="${mapsSearch(s.maps || s.name + ", London")}" target="_blank" rel="noopener">📍 Maps</a></div>`).join("") || `<div class="err">Aucune adresse trouvée. Reformulez la demande.</div>`;
  } catch (err) {
    out.innerHTML = `<div class="err">${err && err.code === "rate_limited" ? "Trop de demandes pour le moment, réessayez dans une minute." : "Claude n'a pas pu répondre. Reformulez la demande."}</div>`;
    if (err && err.code === "not_granted") { sample = null; $("#ask-box").hidden = true; }
  } finally { btn.disabled = false; }
}

// ── Conseils qui défilent ─────────────────────────────────────────────
function showTip() { $("#tip").textContent = TIPS[tipIdx % TIPS.length]; tipIdx++; }
showTip(); setInterval(showTip, 6000);

if (!dayOf(view) && view !== "adr" && view !== "dep") view = "ven";
render();

// Claude (ajout IA) : s'active si la page y a accès
(async () => {
  try { sample = window.claude?.use ? await window.claude.use("sample") : null; } catch { sample = null; }
  if (sample) { const box = $("#ask-box"); if (box) box.hidden = false; }
})();
</script>
